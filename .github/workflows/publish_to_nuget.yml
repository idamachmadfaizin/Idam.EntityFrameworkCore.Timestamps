name: Publish
on:
  push:
    tags:
      - 'v*'

env:
  dotnetVersion: 10.x.x
  srcProjectPath: Idam.EntityFrameworkCore.Timestamps
  testProjectPath: Idam.EntityFrameworkCore.Timestamps.Tests

permissions:
  contents: read

jobs:
  test:
    name: "Test the package before publish"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET ${{ env.dotnetVersion }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.dotnetVersion }}

      - name: Cache .NET Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Look to see if there is a cache hit for the corresponding requirements file
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.Build.props', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # The whole solution, so a compile error in the library or the sample fails here
      # rather than at release time.
      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      # Needs a Docker daemon for the SQL Server, PostgreSQL and MySQL containers.
      # ubuntu-latest ships one; SQLite runs in-process.
      - name: Test
        run: dotnet test ${{ env.testProjectPath }} --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.job }}
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: warn

  publish:
    name: "Build, Pack, and Publish package to NuGet.org"
    runs-on: ubuntu-latest

    needs: test

    # Creating the GitHub release needs write access; the rest of the workflow stays read-only.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # git-cliff reads the whole history and every tag.
          fetch-depth: 0

      - name: Setup .NET ${{ env.dotnetVersion }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.dotnetVersion }}

      - name: Cache .NET Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Look to see if there is a cache hit for the corresponding requirements file
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.Build.props', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore `${{ env.srcProjectPath }}` Dependencies
        run: dotnet restore ${{ env.srcProjectPath }}

      # Take the version from the tag that triggered this run, so the published package can
      # never disagree with the tag. `v10.1.0` -> `10.1.0`.
      - name: Resolve version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build `${{ env.srcProjectPath }}`
        run: dotnet build ${{ env.srcProjectPath }} --configuration Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Echo package output
        run: ls ${{ github.workspace }}/${{ env.srcProjectPath }}/bin/Release

      - name: Publish to NuGet.org
        run: dotnet nuget push ${{ env.srcProjectPath }}/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Release notes come from the commits, via cliff.toml. The generator is run in full and
      # its first section kept, because git-cliff's range flags (--latest, --current) count the
      # pre-release tags that cliff.toml folds away. At a stable tag the first section is that
      # version; at a pre-release tag it is everything since the last stable release.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx --yes git-cliff@2 --strip all | awk '/^## \[/{n++; next} n==1' > notes.md
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
