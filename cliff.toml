# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# CHANGELOG.md is generated from commit subjects: edit this file or the commits, never the
# changelog by hand. Release flow is in AGENTS.md.

[remote.github]
owner = "idamachmadfaizin"
repo = "Idam.EntityFrameworkCore.Timestamps"

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**BREAKING:** {% endif %}\
          {{ commit.message | split(pat="\n") | first | upper_first | trim | trim_end_matches(pat=".") }} \
          ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                /compare/{{ release.previous.version }}..{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                /tree/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
            /compare/{{ release.previous.version }}..HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
# Pre-10.0 history is mostly not conventional; drop it rather than guess a group.
filter_unconventional = true
split_commits = false
# First match wins.
commit_parsers = [
    # Sample app and tests are not part of the package.
    { message = "^\\w+\\((sample|tests?)\\)", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^(perf|refactor)", group = "Changed" },
    { message = "^(chore|docs|test|ci|build|style)", skip = true },
]
# A breaking commit is kept even if a parser above would skip it.
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
# The 8.0.0 alphas were never released as stable; leave them out entirely.
skip_tags = "^v8\\."
# Pre-releases fold into the next stable release.
ignore_tags = "-(alpha|beta|rc)"
topo_order = false
sort_commits = "oldest"
